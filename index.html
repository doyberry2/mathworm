<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 화면 비율 자동 맞춤 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>수학 지렁이 키우기 - Math Worm Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation; /* 모바일 연동 터치 반응속도 개선 */
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 10px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 5px;
      text-align: center;
    }

    /* 게임 캔버스 반응형 설정 (화면 안 잘리게) */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: center;
    }

    canvas {
      background-color: #000;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      height: auto;
      aspect-ratio: 1 / 1; /* 가로세로 1:1 비율 유지 */
    }

    /* 모바일/태블릿 전용 화면 방향키 패드 */
    .controls-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 8px;
      width: 100%;
      max-width: 240px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .btn-arrow {
      background-color: #333;
      color: #fff;
      border: 2px solid #555;
      border-radius: 12px;
      font-size: 1.5rem;
      padding: 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
    }

    .btn-arrow:active {
      background-color: #4CAF50;
    }

    /* 버튼 위치 배치 */
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>🐍 수학 지렁이 키우기</h1>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
  </div>

  <!-- 터치용 화면 화살표 패드 -->
  <div class="controls-container">
    <button class="btn-arrow btn-up" id="btn-up">▲</button>
    <button class="btn-arrow btn-left" id="btn-left">◀</button>
    <button class="btn-arrow btn-down" id="btn-down">▼</button>
    <button class="btn-arrow btn-right" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 키보드 이벤트 연결
    document.addEventListener('keydown', (e) => {
      handleMove(e.key);
    });

    // 화면 터치 버튼 이벤트 연결 (모바일/태블릿)
    document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); handleMove('ArrowUp'); });
    document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); handleMove('ArrowDown'); });
    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); handleMove('ArrowLeft'); });
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); handleMove('ArrowRight'); });

    // 클릭 이벤트 (PC 테스트용)
    document.getElementById('btn-up').addEventListener('click', () => handleMove('ArrowUp'));
    document.getElementById('btn-down').addEventListener('click', () => handleMove('ArrowDown'));
    document.getElementById('btn-left').addEventListener('click', () => handleMove('ArrowLeft'));
    document.getElementById('btn-right').addEventListener('click', () => handleMove('ArrowRight'));

    function handleMove(direction) {
      // 기존 작성하셨던 지렁이 이동 로직 함수를 여기에 연결하거나 넣어주시면 됩니다.
      console.log("이동 방향:", direction);
    }
  </script>
</body>
</html>
